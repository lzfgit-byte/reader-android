  <h1>长夜手记 · 第一章</h1>
  <div class="content">
夜里的风从窗缝里进来，带着一点铁锈味。

我把台灯调暗，继续读昨天没读完的那一页。纸上有前一个读者留下的折角，像是无声的提醒。

<img src="https://demo.local/pic/1.jpg">

有些故事不需要结局，它只需要一个人愿意在深夜里把它读完。
